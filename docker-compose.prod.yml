# Docker Compose for running anki-mcp-server in production
# This is separate from the .docker/ folder which is for E2E testing

services:
  anki-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Point to AnkiConnect on host machine
      # On Linux: use host.docker.internal or your machine's IP
      # On Windows/Mac: host.docker.internal should work
      - ANKI_CONNECT_URL=http://host.docker.internal:8765
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

